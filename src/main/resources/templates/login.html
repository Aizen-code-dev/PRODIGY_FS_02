<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-container">
  <form class="auth-card" th:action="@{/login}" method="post">
    <h2>Login</h2>

<!--    &lt;!&ndash; Role toggle switch &ndash;&gt;-->
<!--    <div class="role-toggle-switch">-->
<!--      <label id="roleLabel">Employee / Admin</label>-->
<!--      <label class="switch">-->
<!--        <input type="checkbox" id="roleSwitch" onclick="toggleRole()">-->
<!--        <span class="slider"></span>-->
<!--      </label>-->
<!--    </div>-->

    <input type="hidden" name="role" id="role" value="ROLE_USER">

    <input type="text" name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>

    <button type="submit" class="login-btn">Login</button>

    <p class="register-text">
      Don't have an account? <a th:href="@{/register}">Register</a>
    </p>
  </form>
</div>

<script>
  function toggleRole() {
      const switchInput = document.getElementById("roleSwitch");
      const roleInput = document.getElementById("role");
      roleInput.value = switchInput.checked ? "ROLE_ADMIN" : "ROLE_USER";
  }
</script>

</body>
</html>
