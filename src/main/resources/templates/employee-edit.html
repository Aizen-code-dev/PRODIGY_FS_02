<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit Employee</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Navbar -->
<div class="navbar">
  <h3>Admin • Edit Employee</h3>
  <a th:href="@{/logout}">Logout</a>
</div>

<!-- Sidebar -->
<div class="sidebar">
  <a th:href="@{/admin/dashboard}">Dashboard</a>
  <a th:href="@{/admin/employees}">Manage Employees</a>
</div>

<!-- Main Content -->
<div class="content">
  <h2>Edit Employee</h2>
  <form th:action="@{/admin/employees/edit/{id}(id=${employee.id})}" th:object="${employee}" method="post">
    <input type="text" th:field="*{name}" placeholder="Name" required>
    <input type="email" th:field="*{email}" placeholder="Email" required>
    <input type="text" th:field="*{department}" placeholder="Department" required>
    <input type="text" th:field="*{position}" placeholder="Position" required>
    <input type="number" th:field="*{salary}" placeholder="Salary" required>

    <button type="submit">Update Employee</button>
  </form>
</div>

</body>
</html>
